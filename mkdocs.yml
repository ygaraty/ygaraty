site_name: Ygaraty
site_description: Run models across contributed GPUs with Ygaraty.
site_url: https://ygaraty.github.io/ygaraty/
repo_url: https://github.com/ygaraty/ygaraty
edit_uri: ''
docs_dir: _build/docs
site_dir: _build/site
theme:
  name: mkdocs
  color_mode: light
  user_color_mode_toggle: true
nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Models and RAM: public-bundles.md
      - Contributors: contributing-gpu.md
      - Chat and API: api.md
  - Inference:
      - Advanced settings: advanced.md
      - Kyse models: kyse.md
      - Prepare model bundles: model-bundles.md
      - WebRTC and TURN: turn.md
      - Troubleshooting: troubleshooting.md
  - Training and development:
      - DiLoCo training: distributed-training.md
      - Native training: native-training.md
      - Python API: python-api.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
