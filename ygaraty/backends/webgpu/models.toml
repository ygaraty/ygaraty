# Ygaraty's public model registry: the only list of models this release
# supports. `ygaraty models list`, `ygaraty models info` and `ygaraty launch`
# read it. Kaa (the cloud) keeps its own registry and never reads this file.
#
# [models.NAME]          model profile: family, layers, default splits,
#                        recommended GPU memory per worker, validation notes
# [models.NAME.public]   optional published bundles; without it the model is
#                        experimental and runs only from a local checkpoint
#
# Bundle URL: {bundle_base}/{NAME}/prepared/{version}/{N}-workers/bundle.json
# `context` and `output` must match the published manifests (v2: 16,384 and
# 4,096, made by scripts/publish_bundle_limits.py).

schema = 1
bundle_base = "https://ygaraty-models.fra1.digitaloceanspaces.com"

[models."s5-nano"]
family = "qwen35"
layers = 32
splits = [0, 16, 32]
memory_gb = 3
evidence = "research/103-fast-sessions-rollout-rerun.md"
validation = "Two-stage execution measured; 3 GiB device acceptance pending"

[models."s5-nano".public]
version = "v2"
workers = [1, 2, 3, 4]
context = 16384
output = 4096

